name: verify

on:
  push:
    branches: [main]
    tags-ignore: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel stale runs on the same branch to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Minimal GITHUB_TOKEN permissions; the workflow only needs to read
# the repo and upload coverage artifacts.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------
  # Job 1: lint (fast, no Python deps install). Splits fail-fast:
  # if lint fails the test job is skipped on the same commit.
  # ---------------------------------------------------------------
  lint:
    name: lint (py${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: true
      matrix:
        # CI matrix: Python 3.11 + 3.12 + 3.13 across Linux/macOS.
        python-version: ["3.11", "3.12", "3.13"]
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev tools
        run: |
          python -m pip install --upgrade pip
          # mypy needs the package importable to validate the
          # @mcp.tool() decorator return types.
          pip install -e ".[dev]"

      - name: Run ruff
        run: ruff check src/powerbi_orchestrator_mcp

      - name: Run mypy --strict
        run: mypy --strict src/powerbi_orchestrator_mcp

  # ---------------------------------------------------------------
  # Job 2: test (full pytest + coverage + fresh-install e2e).
  # Depends on `lint` so we don't run tests when lint is broken.
  # ---------------------------------------------------------------
  test:
    name: test (py${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        # Python 3.11/3.12/3.13 on Linux/macOS, plus 3.11 on Windows
        # (Windows CI minutes are expensive; 3.11 covers the matrix).
        python-version: ["3.11", "3.12", "3.13"]
        os: [ubuntu-latest, macos-latest, windows-latest]
        exclude:
          # Reduce Windows matrix to Python 3.11 only.
          - os: windows-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.13"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pytest-cov

      - name: Run pytest with coverage
        run: >-
          pytest tests/
          --cov=powerbi_orchestrator_mcp
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --cov-fail-under=80
          -q

      - name: Fresh-install e2e (Linux only — bash subprocess needed)
        if: matrix.os == 'ubuntu-latest'
        run: |
          python -m venv /tmp/verify_venv
          /tmp/verify_venv/bin/pip install --upgrade pip
          /tmp/verify_venv/bin/pip install .
          /tmp/verify_venv/bin/python scripts/verify_mcp_server.py

      - name: Sanity-check no __pycache__ in tree
        if: matrix.os == 'ubuntu-latest'
        run: |
          ! git status --porcelain | grep -E '__pycache__|\.pyc$'

      - name: Upload coverage artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 14

  # ---------------------------------------------------------------
  # Job 3: integration (real PBIP fixture + CLI subprocess).
  # Separate from `test` because the integration suite writes to disk
  # and runs the CLI as a subprocess. Skipped on Windows for now
  # (CLI subprocess paths use POSIX-only assumptions).
  # ---------------------------------------------------------------
  integration:
    name: integration (py${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run integration tests
        run: |
          pytest tests/integration/ -v --no-header
