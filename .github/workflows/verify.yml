name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify MCP server end-to-end (fresh install)
        run: |
          python -m venv /tmp/verify_venv
          /tmp/verify_venv/bin/pip install --upgrade pip
          /tmp/verify_venv/bin/pip install . || pip install .
          # verify_mcp_server.py uses the venv's python to find the
          # installed binary automatically.
          /tmp/verify_venv/bin/python scripts/verify_mcp_server.py

      - name: Run pytest with coverage
        run: |
          pytest tests/ --cov=powerbi_orchestrator_mcp --cov-report=term-missing

      - name: Run mypy --strict
        run: |
          mypy --strict src/powerbi_orchestrator_mcp

      - name: Run ruff check
        run: |
          ruff check src/powerbi_orchestrator_mcp

      - name: Sanity-check no __pycache__ in tree
        run: |
          git status --porcelain | grep -E '__pycache__|\.pyc$' && exit 1 || true
