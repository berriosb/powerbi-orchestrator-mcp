name: e2e-nightly

# Nightly E2E tests against the real engine binaries (`te`).
# See specs/qa/e2e-testing-strategy.md for the design: binaries pinned
# by SHA256, matrix on 3 OS, schedule daily + on-PR when engine adapter
# or fixtures change.
#
# Tabular Editor 2 ships a Windows binary, so `te` is only installed on
# the Windows runner. The PBIP validation the orchestrator performs
# natively runs on every platform and needs no external binary.
#
# Total runtime target: ≤15 min on the slowest runner.

on:
  schedule:
    - cron: '0 4 * * *'   # 04:00 UTC daily
  workflow_dispatch:        # manual trigger
  pull_request:
    paths:
      - 'src/powerbi_orchestrator_mcp/engines/**'
      - 'src/powerbi_orchestrator_mcp/validation/**'
      - 'tests/fixtures/**'
      - 'tests/e2e/**'
      - 'Dockerfile'
      - 'uv.lock'
      - 'scripts/verify_docker_image.py'
      - '.github/workflows/e2e-nightly.yml'

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write           # auto-open issue on failure
  actions: read

jobs:
  # -------------------------------------------------------------------------
  # Download + cache engine binaries. Pinned by SHA256 (see
  # specs/qa/e2e-testing-strategy.md §3.3 for the canonical table).
  #
  # IMPORTANT: this job self-skips when SHA256 placeholders are still in
  # place. To activate real E2E:
  #   1. Replace `PLACEHOLDER_*_SHA256_*` below with real hashes (see
  #      specs/qa/e2e-testing-strategy.md §3.3).
  #   2. Verify the curl URLs point to existing release assets.
  #   3. The workflow will then run nightly + on relevant PRs.
  # -------------------------------------------------------------------------
  engines:
    name: download engines (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            engines: ''
          - os: macos-latest
            engines: ''
          - os: windows-latest
            engines: 'te'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Download Tabular Editor CLI (`te`)
        if: contains(matrix.engines, 'te')
        env:
          TE_VERSION: '2.20.0'
          # SHA256 of TabularEditor.Portable.zip, published in the
          # upstream release notes for 2.20.0.
          TE_SHA256: 'f85e5dc765e5f0664a1518023547115d4046cbbf7e9d37682975844c1bbd9e3c'
        shell: bash
        run: |
          if [[ "$TE_SHA256" == PLACEHOLDER_* ]]; then
            echo "::warning::TE_SHA256 is a placeholder. Skipping `te` download until real SHA256 is set in .github/workflows/e2e-nightly.yml. See specs/qa/e2e-testing-strategy.md §3.3."
            exit 0
          fi
          # The release asset is a zip; the CLI binary lives inside it.
          curl --fail --silent --show-error --location \
            -o te.zip \
            "https://github.com/TabularEditor/TabularEditor/releases/download/${TE_VERSION}/TabularEditor.Portable.zip"
          echo "${TE_SHA256}  te.zip" | sha256sum --check -
          unzip -o -q te.zip -d te-dist
          install -m 755 te-dist/TabularEditor.exe "${{ runner.temp }}/te.exe"
          echo "TE_PATH=${{ runner.temp }}/te.exe" >> "$GITHUB_ENV"
          rm -f te.zip
          rm -rf te-dist

      - name: Report engine availability
        run: |
          echo "te on PATH: $(command -v te || echo 'no')"
          echo "te path: ${TE_PATH:-<none>}"

  # -------------------------------------------------------------------------
  # Run E2E tests. Depends on `engines` having downloaded the binaries.
  # -------------------------------------------------------------------------
  e2e:
    name: pytest e2e (${{ matrix.os }} / py${{ matrix.python-version }})
    needs: engines
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install package in editable mode
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run E2E suite
        id: pytest
        shell: bash
        run: |
          set +e
          mkdir -p test-results
          pytest tests/e2e/ \
            --junitxml=test-results/e2e-${{ matrix.os }}-py${{ matrix.python-version }}.xml \
            --tb=short \
            -v
          PYTEST_EXIT=$?
          echo "pytest_exit_code=${PYTEST_EXIT}" >> "${GITHUB_OUTPUT}"
          exit ${PYTEST_EXIT}

      - name: Fail when the suite skipped everything
        # A job where every test was skipped proves nothing. The engine
        # tests are opt-in per binary, so a green run has to prove that
        # at least the platform-independent ones actually executed.
        if: always()
        shell: bash
        run: |
          set +e
          python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          import glob

          files = glob.glob("test-results/e2e-*.xml")
          if not files:
              print("::error::no junit report was produced")
              sys.exit(1)
          total = skipped = failed = 0
          for path in files:
              root = ET.parse(path).getroot()
              for suite in root.iter("testsuite"):
                  total += int(suite.get("tests", 0))
                  skipped += int(suite.get("skipped", 0))
                  failed += int(suite.get("failures", 0)) + int(suite.get("errors", 0))
          print(f"tests={total} skipped={skipped} failed={failed}")
          if total == 0 or skipped == total:
              print("::error::every E2E test was skipped — the job proved nothing")
              sys.exit(1)
          PY

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results-${{ matrix.os }}-py${{ matrix.python-version }}
          path: test-results/
          retention-days: 30

  # -------------------------------------------------------------------------
  # Build the container image and check it really serves MCP.
  #
  # The image is the delivery form for anyone running the orchestrator in
  # a container, and it breaks in ways the Python suite cannot see: a
  # dependency missing from the image, an entrypoint pointing at a module
  # that was never copied. It broke once that way — the package was
  # installed editable, and the runtime stage did not carry the source
  # tree the editable install pointed at.
  # -------------------------------------------------------------------------
  docker:
    name: build and verify the image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install the package so the tool count can be compared
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Build the image
        run: docker build -t powerbi-orchestrator-mcp:nightly .

      - name: Check the image works as an MCP server
        run: python scripts/verify_docker_image.py powerbi-orchestrator-mcp:nightly

  # -------------------------------------------------------------------------
  # Auto-open a GitHub issue on nightly failure so the maintainer
  # gets pinged without having to dig through Actions logs.
  # -------------------------------------------------------------------------
  report-failure:
    name: report failure
    needs: [e2e, docker]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download test results
        uses: actions/download-artifact@v8
        with:
          pattern: e2e-results-*
          path: test-results/
          merge-multiple: true

      - name: Open issue
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            let body = 'Nightly E2E run failed.\n\n';
            body += 'Run: ${{ github.run_id }}\n';
            body += 'Commit: ${{ github.sha }}\n\n';
            body += '## Test results\n\n';
            const files = fs.readdirSync('test-results').filter(f => f.endsWith('.xml'));
            for (const f of files) {
              const xml = fs.readFileSync(path.join('test-results', f), 'utf8');
              body += '### ' + f + '\n\n```xml\n' + xml.slice(0, 2000) + '\n```\n\n';
            }
            body += '\nSee the full Actions run for context.';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'e2e-nightly failed @ ' + new Date().toISOString().slice(0, 10),
              body: body,
              labels: ['e2e', 'nightly', 'bug'],
            });